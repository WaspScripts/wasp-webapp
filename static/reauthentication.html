<div style="text-align: center; font-family: Roboto, Arial, sans-serif">
	<h2 style="margin-top: 2rem; margin-bottom: 2rem; font-weight: bold">Confirm Password Change</h2>
	<p>Enter this code on WaspScripts to confirm the change of your password:</p>
	<p
		style="
			display: inline-block;
			background-color: #fcbf3f;
			color: #444;
			font-size: 1.5rem;
			font-weight: bold;
			letter-spacing: 0.25rem;
			padding: 0.5rem 1rem;
			border: 1px solid #dea123;
			border-radius: 0.25rem;
			margin-top: 2rem;
			margin-bottom: 2rem;
		"
	>
		{{ .Token }}
	</p>
	<p>
		If you didn't try to change your password, someone may have access to your account. Log out of all devices
		and contact support@waspscripts.com.
	</p>
</div>
